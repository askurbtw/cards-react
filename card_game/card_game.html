<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style3.css" />
    <script src="card_game.js" defer></script>
    <title>Card Game</title>
  </head>
  <body>
    <header>
      <nav>
        <div id="header-li">
          <ul>
            <li><h2>Single Player</h2></li>
            <li><h2>Multiplayer</h2></li>
          </ul>
        </div>
      </nav>
    </header>
    <div id="game-settings">
      <div id="name-div"><input id="name-input"placeholder="Enter your name..."/></div>
      <div id="select-div">
        <label for="players-select" id="players-label"
          >Select number of players
        </label>
        <select name="players-select" id="players-select">
          <option value="" disabled selected>Players</option>
          <option value="2-players">2</option>
          <option value="3-players">3</option>
          <option value="4-players">4</option>
        </select>
      </div>
    </div>
    <div id="game-launch">
      <button id="start-game">Start Game</button>
    </div>
  </body>
</html>
